name: Atualizar dados Metabase
on:
  schedule:
    # 06:00 horário de Brasília = 09:00 UTC (UTC-3)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Data início (YYYY-MM-DD) — deixe em branco para usar 1º do mês'
        required: false
        default: ''
jobs:
  atualizar:
    name: Buscar dados e atualizar dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar dados
        env:
          MB_URL:  ${{ vars.MB_URL || 'https://metabase.gocase.com.br' }}
          MB_DB:   ${{ vars.MB_DB  || '3' }}
          MB_USER: ${{ secrets.MB_USER }}
          MB_PASS: ${{ secrets.MB_PASS }}
        run: python scripts/atualizar_dados.py

      - name: Deploy no GoDeploy
        env:
          GODEPLOY_APP_ID: ${{ secrets.GODEPLOY_APP_ID }}
          GODEPLOY_TOKEN:  ${{ secrets.GODEPLOY_TOKEN }}
        run: |
          echo "Obtendo token de upload..."
          UPLOAD_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $GODEPLOY_TOKEN" \
            "https://mcp.devgogroup.com/api/apps/$GODEPLOY_APP_ID/upload-token")
          UPLOAD_TOKEN=$(echo $UPLOAD_RESP | python3 -c "import sys,json; print(json.load(sys.stdin)['uploadToken'])")
          UPLOAD_URL=$(echo $UPLOAD_RESP | python3 -c "import sys,json; print(json.load(sys.stdin)['uploadUrl'])")

          echo "Enviando index.html..."
          UPLOAD_ID=$(curl -s -X POST \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F "index.html=@index.html" \
            "$UPLOAD_URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['uploadId'])")

          echo "Publicando app (uploadId=$UPLOAD_ID)..."
          curl -s -X POST \
            -H "Authorization: Bearer $GODEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uploadId\":\"$UPLOAD_ID\",\"assets\":[\"index.html\"]}" \
            "https://mcp.devgogroup.com/api/apps/$GODEPLOY_APP_ID/update"
          echo "✅ Deploy concluído"

      - name: Salvar an_cache no git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          [ -f an_cache.js ] && git add an_cache.js || true
          if git diff --staged --quiet; then
            echo "Sem mudanças para commitar."
          else
            git commit -m "chore: atualizar cache — $(date +'%d/%m/%Y %H:%M')"
            git pull --rebase origin main
            git push
          fi
