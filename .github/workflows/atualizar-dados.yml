name: Atualizar dados Metabase
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Data início (YYYY-MM-DD) — deixe em branco para usar 1º do mês'
        required: false
        default: ''
jobs:
  atualizar:
    name: Buscar dados e atualizar dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar dados
        env:
          MB_URL:  ${{ vars.MB_URL || 'https://metabase.gocase.com.br' }}
          MB_DB:   ${{ vars.MB_DB  || '3' }}
          MB_USER: ${{ secrets.MB_USER }}
          MB_PASS: ${{ secrets.MB_PASS }}
        run: python scripts/atualizar_dados.py

      - name: Commit se houve mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html an_cache.js
          if git diff --staged --quiet; then
            echo "Nenhuma mudança detectada — sem commit."
          else
            DATA=$(date +'%d/%m/%Y %H:%M')
            git commit -m "chore: atualizar dados Metabase — $DATA"
            git push
            echo "✅ Commit e push realizados."
          fi
